# Battle of Marathon - VISUAL PROOF OF CONCEPT configuration.
# Times are seconds on the authoritative narration MP3 (51.72 s).
battle:
  id: marathon-490bc
  name: Battle of Marathon
  year: -490
  date_note: "Late summer (August or September) 490 BC; the exact day is debated."
  place: "Plain of Marathon, north-east Attica, Greece"

audio:
  narration: ../../../projects/marathon-poc/assets/audio/narration_original.mp3   # never modified
  transcript: ../../../projects/marathon-poc/assets/audio/transcript.json
  # Whisper (base) mis-heard two words; captions are corrected, the audio is not touched.
  caption_fixes: {Plataan: Plataean, gleaned: gleamed}

sides:
  greeks:  {name: "Athenians and Plataeans", civilizations: [greek], color: "#b8432f"}
  persians: {name: "Achaemenid Persian expeditionary force", civilizations: [persian, saka], color: "#3f5a7a"}

# ---------------------------------------------------------------- research
research:
  sources:
    - "Herodotus, Histories 6.94-6.117 (main ancient account, written c. 430s-420s BC)"
    - "Herodotus 7.61, 7.64 (equipment of Persian and Saka contingents in 480 BC)"
    - "Herodotus 9.61-62, 9.99 (Persian wicker-shield walls at Plataea and Mycale, 479 BC)"
  claims:
    - {claim: "Athenians and Plataeans faced the Persian landing force at Marathon in 490 BC", status: attested, ref: "Hdt 6.102-6.108"}
    - {claim: "Miltiades was one of the ten Athenian generals and urged battle", status: attested, ref: "Hdt 6.109-6.110"}
    - {claim: "Greek centre few ranks deep, wings strong; Plataeans on the left, polemarch Callimachus on the right", status: attested, ref: "Hdt 6.111"}
    - {claim: "The Athenians advanced against the Persians at a run", status: attested, ref: "Hdt 6.112", note: "Herodotus says 8 stades (c. 1.4 km); many historians think only the last stretch was run. The test shows a shortened run."}
    - {claim: "Persians and Sakai in the Persian centre broke the Greek centre", status: attested, ref: "Hdt 6.113"}
    - {claim: "Greek wings won, then drew together against the Persian centre; Persians fled to the ships", status: attested, ref: "Hdt 6.113-6.115"}
    - {claim: "Persian cavalry took part in the battle", status: uncertain, ref: "Hdt 6.102 (Marathon chosen as good cavalry ground) vs no cavalry in Hdt 6.111-6.113; Suda 'choris hippeis'", decision: "No cavalry shown in the proof of concept."}
    - {claim: "Military standards or flags carried at Marathon", status: unattested, decision: "No flags or standards shown. Inventing them would present a fiction as fact."}
    - {claim: "Persian infantry formed a wicker-shield wall with archers behind", status: reconstruction, ref: "Hdt 9.61-62, 9.99 (479 BC)", decision: "Shown, with an on-screen reconstruction note."}
  numbers_note: "Herodotus gives no army sizes for Marathon. Later sources give c. 9,000-10,000 Athenians and c. 1,000 Plataeans; Persian numbers are unknown. Figure counts in the render are illustrative, not to scale."

# ---------------------------------------------------------------- forces
# x = centre of the block along the battle line, z = front rank (Greeks face -z, Persians +z)
units:
  greek-left:   {side: greeks, label: "Plataeans (left wing)", design: hoplite-late-archaic, width: 18, depth: 8, x: -25, z: 30}
  greek-centre: {side: greeks, label: "Athenian centre (thin)", design: hoplite-late-archaic, width: 32, depth: 4, x: 0, z: 30}
  greek-right:  {side: greeks, label: "Athenian right wing", design: hoplite-late-archaic, width: 18, depth: 8, x: 25, z: 30}
  persian-right:  {side: persians, label: "Persian wing", formation: spara-wall, front: persian-shield-bearer, rear: persian-archer, width: 20, depth: 8, x: -26, z: 0}
  persian-centre: {side: persians, label: "Persians and Sakai (centre)", formation: spara-wall, front: persian-shield-bearer,
                   rear: persian-archer, rear_mix: {design: saka-archer, from: 0.38, to: 0.62}, width: 32, depth: 8, x: 0, z: 0}
  persian-left:   {side: persians, label: "Persian wing", formation: spara-wall, front: persian-shield-bearer, rear: persian-archer, width: 20, depth: 8, x: 26, z: 0}

commanders:
  - {id: miltiades, label: "Greek commander (illustrative)", design: hoplite-late-archaic, unit: greek-centre, u: 6, v: -3.2, crest_color: "#efe8d6", crest_scale: 1.3,
     command: [13.2, 16.6]}

