fact_check:
- claim: In 216 BC ... near the town of Cannae in southern Italy
  support: Polybius 3.107-117; Livy 22.44-52. Cannae lies on the Aufidus (Ofanto) in Apulia.
- claim: a much larger Roman force
  support: 'Polybius 3.113-114: ~80,000 Roman/allied infantry vs ~40,000 Carthaginian infantry and ~10,000 cavalry.'
- claim: strongest troops on the flanks; centre fell back
  support: 'Polybius 3.113-115: Libyan (African) heavy infantry on the wings; Gauls and Iberians in a forward-bowed
    centre that gave ground.'
- claim: cavalry attacked from behind
  support: 'Polybius 3.116: Hasdrubal''s cavalry, after routing the Roman horse, fell on the Roman rear.'
- claim: Tens of thousands ... killed or captured
  support: Polybius 3.117 gives ~70,000 killed; Livy 22.49 gives 45,500 infantry and 2,700 cavalry killed, plus
    thousands taken prisoner. Exact figures disputed; the script stays deliberately general and no number is shown
    on screen.
- claim: Rome refused to surrender ... war far from over
  support: Livy 22.58-61 (Rome refused to ransom prisoners / negotiate); the Second Punic War ended in 201 BC.
- claim: 'On-screen: "The war went on until 201 BC"'
  support: The Second Punic War (218-201 BC) ended with the peace after Scipio's victory at Zama (202 BC); Livy
    30.37-43, Polybius 15.18.
