extra_credits:
  - "Narration: user-supplied MP3 (ElevenLabs voice), used complete and unedited; only a constant +5 dB gain (peak limiter on 0.04% of samples) and 3 s of silence before / 7 s after were added."
  - "Ambience: original wind/room-tone bed synthesised locally for this video (make_ambience.py). No music."
  - "Fonts: Playfair Display and Space Grotesk (SIL Open Font License), bundled with OpenMontage."
  - "Rivers and coastlines: Natural Earth 1:10m (public domain), https://www.naturalearthdata.com/"

fact_check:
  - claim: "9 A.D."
    status: correct
    sources: ["Velleius Paterculus 2.117", "Cassius Dio 56.18-24 (events of AD 9)"]
  - claim: "Three Roman legions marched into Germania"
    status: correct, simplified
    note: "Legions XVII, XVIII and XIX with auxiliaries and cavalry (Velleius 2.117; Tacitus Ann. 1.60-62 names the lost eagles). Varus was already operating east of the Rhine (summer quarters near the Weser, Dio 56.18-19); the ambush came on the march back toward winter quarters / a reported uprising."
  - claim: "believing Rome could conquer the lands beyond the Rhine"
    status: interpretation
    note: "Rome had campaigned between Rhine and Elbe since Drusus (12-9 BC) and was organising the region as a province (Dio 56.18). Wording on screen: 'campaigned ... since 12 BC'."
  - claim: "Their commander, Varus"
    status: correct
    sources: ["Velleius 2.117", "Dio 56.18"]
  - claim: "trusted Arminius, a Germanic leader trained by Rome"
    status: correct
    note: "Arminius, Cheruscan noble, served with Roman forces, held Roman citizenship and equestrian rank (Velleius 2.118). Segestes warned Varus (Velleius 2.118; Tacitus Ann. 1.55) - not in narration."
  - claim: "Arminius was secretly preparing an ambush. He led the Romans into the Teutoburg Forest."
    status: correct per ancient accounts
    note: "Dio 56.19: conspirators escorted Varus then reported a distant uprising to lure him; Tacitus Ann. 1.60 'saltus Teutoburgiensis'. Location debated; Kalkriese is the leading proposed site (finds since 1987; excavations since 1989)."
  - claim: "Narrow tracks, dense woods, and heavy rain"
    status: correct per Cassius Dio 56.20-21
  - claim: "Germanic warriors attacked from the trees"
    status: correct per Cassius Dio 56.20
  - claim: "For days, the legions fought to survive."
    status: correct per Cassius Dio 56.21-22 (several days)
  - claim: "all three were destroyed"
    status: correct
    note: "Legions XVII-XIX never reconstituted. Casualty figures are modern estimates only (often c. 15,000-20,000) - not stated in the video."
  - claim: "The defeat halted Rome's expansion east of the Rhine."
    status: mainstream interpretation, simplified
    note: "Rome returned under Germanicus AD 14-16 (Tacitus Ann. 1-2) and recovered two eagles; the third was recovered AD 41 (Dio 60.8). No lasting province east of the Rhine followed. The video says so on screen."
