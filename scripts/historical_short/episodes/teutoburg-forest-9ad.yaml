# The Battle of the Teutoburg Forest (AD 9) — landscape documentary (1920x1080)
# documentary-montage pipeline, historical profile, HistoricalDocumentary composition
# (remotion-composer/src/historical-documentary/). All times = seconds on the
# narration master (projects/teutoburg-forest-9ad/assets/audio/narration_master.wav:
# user's ElevenLabs MP3, 49.554 s, +5.0 dB constant gain (build_master_linear.py), +3.0 s lead-in, +7.0 s tail
# = 59.554 s). Scene cuts sit in the measured pauses between sentences.
#
# Narration sentences (speech onset from silencedetect on the master):
#   3.04  9 A.D.
#   4.80  Three Roman legions marched into Germania, believing Rome could conquer the lands beyond the Rhine.
#  11.11  Their commander, Varus, trusted Arminius, a Germanic leader trained by Rome.
#  16.88  But Arminius was secretly preparing an ambush.
#  20.28  He led the Romans into the Teutoburg Forest.
#  23.29  Narrow tracks, dense woods, and heavy rain stretched their columns and made it hard to defend themselves.
#  29.99  Then, Germanic warriors attacked from the trees.
#  33.63  Roman units struggled to form ranks as the ambush spread along the route.
#  38.05  For days, the legions fought to survive.
#  41.04  Their formations collapsed, and all three were destroyed.
#  45.04  The defeat halted Rome's expansion east of the Rhine.
#  48.71  One forest, one ambush, three legions lost.   (speech ends 52.41)

id: teutoburg-forest-9ad
title: "The Battle of the Teutoburg Forest (AD 9)"
layout: landscape
narration: audio/narration_master.wav
images_dir: images
ambience:
  src: audio/ambience.wav
  volume: 0.04

# shared phase times for every tactical-reconstruction scene (one continuous model)
battle_times: &bt
  wardsIn: 16.9
  sightlines: [17.5, 20.3]
  wall: 18.2
  columnEnter: 18.4
  marchUntil: 29.9
  rain: [23.0, 33.4]
  callouts: [23.5, 28.0]
  stretched: 27.4
  attack: 30.3
  missiles: [30.1, 38.0]
  spread: [33.9, 37.0]
  regroup: [34.0, 37.4]
  inset: [34.4, 37.95]
  collapse: [41.1, 43.6]
  eagles: [43.05, 43.4, 43.75]
  aftermath: 48.0

battle_tag: &tag "TACTICAL RECONSTRUCTION · SCHEMATIC"
battle_foot: &foot "Original schematic reconstruction · terrain modelled on the Kalkriese pass (a proposed, debated site) · unit numbers, order of march and positions are illustrative, not recorded"
basemap: &bm maps/basemap.json

scenes:
  # ---------------------------------------------------------------- opening
  - id: s01_open
    kind: image
    start: 0.0
    end: 4.8
    asset: landscape_view
    fit: cover
    zoomFrom: 1.03
    zoomTo: 1.14
    panX: [30, -30]
    title: { text: "The Battle of the Teutoburg Forest", sub: "GERMANIA · AD 9", at: 0.5, until: 4.75 }
    labelAt: 99   # no label card under the title; identified in s14 and CREDITS
    label:
      tag: "SITE PHOTO"
      title: "Kalkriese, near Osnabrück"
    fallback:   # used only if the photo cannot be obtained
      kind: battle
      times: *bt
      hideHeading: true
      headings: []
      camera:
        - { t: 0.0, x: 1600, y: 960, zoom: 0.5 }
        - { t: 4.8, x: 1700, y: 1000, zoom: 0.62 }
      title: { text: "The Battle of the Teutoburg Forest", sub: "GERMANIA · AD 9", at: 0.5, until: 4.75 }

